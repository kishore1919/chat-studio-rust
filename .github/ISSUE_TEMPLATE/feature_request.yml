name: Feature Request
description: Suggest an idea or enhancement
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Is your feature request related to a problem?
      placeholder: |
        I'm always frustrated when...
        It would be great if...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered
      placeholder: |
        - Alternative 1
        - Alternative 2
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of the app does this relate to?
      options:
        - Providers / Models
        - Chat / Streaming
        - UI / Theming
        - Settings / Config
        - MCP / Tools
        - Agents / Skills
        - Database / History
        - Build / Packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references
      placeholder: |
        - Links to related issues/PRs
        - Screenshots or mockups
        - API documentation for new providers
    validations:
      required: false