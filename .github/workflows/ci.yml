name: CI

on:
  push:
    branches: [main]
  pull_request:

# The MSVC toolchain is required (rusqlite's bundled sqlite3 and reqwest's
# rustls-tls both link against it on Windows), so this must run on
# windows-latest rather than the cheaper ubuntu-latest.
jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: make install

      - name: Backend checks (fmt, clippy, tests)
        run: make fmt-check clippy test

      - name: Frontend checks (typecheck, lint)
        run: cd ui && bun x tsc -b && bun run lint
