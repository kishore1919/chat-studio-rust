[package]
name = "chat-studio"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
async-trait = "0.1"

rusqlite = { version = "0.31", features = ["bundled"] }

dirs = "6"
thiserror = "1"
open = "5"

# Direct tracing rather than tauri-plugin-log: settings loading and db opening
# both run before tauri::Builder exists, and those are the two calls most
# likely to fail on a user's machine.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tracing-appender = "0.2"

[dev-dependencies]
wiremock = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
