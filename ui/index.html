<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Studio</title>
    <script>
      (function () {
        // Older installs may still have a VS Code-style id here (e.g.
        // 'dark-modern', 'solarized-light') from before the theme system was
        // simplified to Cherry Studio-style light/dark - bucket by prefix
        // rather than assume 'system', so a pre-existing dark preference
        // doesn't flash light for one frame.
        var id = localStorage.getItem('chat-studio-theme-id') || localStorage.getItem('chat-studio-theme') || 'system'
        var resolved
        if (id === 'light' || id === 'dark') resolved = id
        else if (id === 'system') resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        else resolved = (id.indexOf('light') === 0 || id === 'solarized-light') ? 'light' : 'dark'
        document.documentElement.dataset.theme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
