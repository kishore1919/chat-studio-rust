<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Studio</title>
    <script>
      (function () {
        var id = localStorage.getItem('chat-studio-theme-id')
        if (!id) {
          var legacy = localStorage.getItem('chat-studio-theme') || 'system'
          if (legacy === 'light') id = 'light-modern'
          else if (legacy === 'dark') id = 'dark-modern'
          else id = legacy
        }
        var lightIds = { 'light-modern': 1, 'solarized-light': 1 }
        var resolved = id === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : (lightIds[id] ? 'light' : 'dark')
        document.documentElement.dataset.theme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
